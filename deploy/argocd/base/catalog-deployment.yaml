apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubevirt-ui-plugin-catalog
  namespace: cattle-ui-plugin-system
  labels:
    app.kubernetes.io/name: kubevirt-ui-plugin-catalog
    app.kubernetes.io/part-of: kubevirt-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kubevirt-ui-plugin-catalog
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubevirt-ui-plugin-catalog
        app.kubernetes.io/part-of: kubevirt-dashboard
    spec:
      # imagePullSecrets:
      #   - name: harbor-qe
      containers:
        - name: catalog
          image: nova-harbor.mousquetaires.com/qe/kubevirt-ui-plugin-catalog:1.4.0-rc.2
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
