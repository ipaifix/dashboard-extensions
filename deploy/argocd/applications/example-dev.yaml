# Exemple Application Argo CD — overlay DEV. Adapter repoURL / destination / project.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubevirt-dashboard-dev
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: kubevirt-dashboard
    stime.io/env: dev
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@nova-gitssh.mousquetaires.com:applications/qe/kubevirt-dashboard.git
    targetRevision: main
    path: deploy/argocd/overlays/dev
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
  ignoreDifferences:
    - group: catalog.cattle.io
      kind: UIPlugin
      jsonPointers:
        - /status
